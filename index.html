<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailBooker - Railway Ticket Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .train-search {
            background: url('https://images.unsplash.com/photo-1474487548417-781cb71495f3?auto=format&fit=crop&q=80') center/cover;
        }
        .toast {
            animation: slideIn 0.3s ease-in-out;
        }
        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Toast Notification -->
    <div id="toast" class="hidden fixed top-4 right-4 z-50 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg toast">
        <span id="toastMessage"></span>
    </div>

    <!-- Navigation -->
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4">
            <div class="flex justify-between items-center h-16">
                <a href="#" class="text-2xl font-bold">RailBooker</a>
                <div class="hidden md:flex space-x-4">
                    <a href="#" class="hover:text-blue-200">Home</a>
                    <a href="#" class="hover:text-blue-200">My Bookings</a>
                    <button id="loginBtn" class="bg-white text-blue-600 px-4 py-2 rounded-lg hover:bg-blue-50">Login</button>
                    <button id="signupBtn" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-400">Sign Up</button>
                </div>
                <button id="mobileMenu" class="md:hidden">
                    <i class="bi bi-list text-2xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div id="mobileMenuContent" class="hidden md:hidden bg-blue-600 text-white">
        <div class="container mx-auto px-4 py-2">
            <a href="#" class="block py-2">Home</a>
            <a href="#" class="block py-2">My Bookings</a>
            <a href="#" class="block py-2">Login</a>
            <a href="#" class="block py-2">Sign Up</a>
        </div>
    </div>

    <!-- Hero Section -->
    <div class="train-search h-96 flex items-center justify-center">
        <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-4xl mx-4">
            <h1 class="text-2xl md:text-3xl font-bold text-center mb-6">Find and Book Train Tickets</h1>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <input type="text" placeholder="From" class="p-2 border rounded">
                <input type="text" placeholder="To" class="p-2 border rounded">
                <input type="date" class="p-2 border rounded">
                <button class="bg-blue-600 text-white p-2 rounded hover:bg-blue-500">Search Trains</button>
            </div>
        </div>
    </div>

    <!-- Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50">
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="bg-white rounded-lg p-8 max-w-md w-full">
                <h2 class="text-2xl font-bold mb-6">Login</h2>
                <form id="loginForm">
                    <div class="mb-4">
                        <label class="block mb-2">Email</label>
                        <input type="email" class="w-full p-2 border rounded" required>
                    </div>
                    <div class="mb-6">
                        <label class="block mb-2">Password</label>
                        <input type="password" class="w-full p-2 border rounded" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-500">Login</button>
                </form>
                <button class="mt-4 text-gray-600 hover:text-gray-800" onclick="closeModal('loginModal')">Close</button>
            </div>
        </div>
    </div>

    <!-- Signup Modal -->
    <div id="signupModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50">
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="bg-white rounded-lg p-8 max-w-md w-full">
                <h2 class="text-2xl font-bold mb-6">Sign Up</h2>
                <form id="signupForm">
                    <div class="mb-4">
                        <label class="block mb-2">Name</label>
                        <input type="text" class="w-full p-2 border rounded" required>
                    </div>
                    <div class="mb-4">
                        <label class="block mb-2">Email</label>
                        <input type="email" class="w-full p-2 border rounded" required>
                    </div>
                    <div class="mb-4">
                        <label class="block mb-2">Phone</label>
                        <input type="tel" class="w-full p-2 border rounded" required>
                    </div>
                    <div class="mb-4">
                        <label class="block mb-2">Password</label>
                        <input type="password" class="w-full p-2 border rounded" required>
                    </div>
                    <div class="mb-6">
                        <label class="block mb-2">Confirm Password</label>
                        <input type="password" class="w-full p-2 border rounded" required>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-500">Sign Up</button>
                </form>
                <button class="mt-4 text-gray-600 hover:text-gray-800" onclick="closeModal('signupModal')">Close</button>
            </div>
        </div>
    </div>

    <script>
        // Mobile menu toggle
        document.getElementById('mobileMenu').addEventListener('click', () => {
            const menu = document.getElementById('mobileMenuContent');
            menu.classList.toggle('hidden');
        });

        // Modal handling
        document.getElementById('loginBtn').addEventListener('click', () => {
            document.getElementById('loginModal').classList.remove('hidden');
        });

        document.getElementById('signupBtn').addEventListener('click', () => {
            document.getElementById('signupModal').classList.remove('hidden');
        });

        function closeModal(modalId) {
            document.getElementById(modalId).classList.add('hidden');
        }

        // Form submissions
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            showToast('Login successful!');
            closeModal('loginModal');
        });

        document.getElementById('signupForm').addEventListener('submit', (e) => {
            e.preventDefault();
            showToast('Account created successfully!');
            closeModal('signupModal');
        });

        // Toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }

        // Close modals when clicking outside
        window.onclick = (event) => {
            const modals = document.getElementsByClassName('fixed');
            Array.from(modals).forEach(modal => {
                if (event.target === modal) {
                    modal.classList.add('hidden');
                }
            });
        }
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
